services:
  - type: web
    name: recoverai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_PREFIX
        value: /api
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_MODE
        value: auto
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString

databases:
  - name: recoverai-db
    plan: free
    databaseName: recoverai
    user: recoverai
